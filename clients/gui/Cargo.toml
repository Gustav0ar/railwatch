[package]
name = "railwatch-gui"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
[dependencies]
railwatch-core = { path = "../../crates/core" }
railwatch-client = { path = "../../crates/client" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
chrono = "0.4"
slint = { version = "=1.17.1", default-features = false, features = ["accessibility", "backend-winit", "compat-1-2", "renderer-software", "std"] }
[build-dependencies]
slint-build = "=1.17.1"

[dev-dependencies]
railwatch-hardware = { path = "../../crates/hardware" }

# Keep the GUI independently buildable, including archives nested inside another workspace.
[workspace]
resolver = "2"
